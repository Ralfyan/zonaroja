<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Los 32 equipos de la NFL · ZonaRoja</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<div id="cabecera"></div>
<main class="wrap">
  <h1 style="margin-top:2rem">Los 32 equipos</h1>
  <p class="lead muted" style="max-width:720px">Dos conferencias (AFC y NFC), cada una con cuatro divisiones de cuatro equipos. En dorado, los equipos que ya han jugado en Madrid.</p>
  <div class="filtros">
    <button data-f="Todos">Todos</button>
    <button data-f="España">🇪🇸 Han jugado en Madrid</button>
    <button data-f="Campeones">🏆 4 o más anillos</button>
    <button data-f="Sin anillo">😢 Nunca han ganado</button>
  </div>
  <div id="lista-equipos"></div>
  <p class="muted">¿No sabes cuál elegir? <a href="test.html">Haz el test</a>.</p>
</main>
<div id="pie"></div>
